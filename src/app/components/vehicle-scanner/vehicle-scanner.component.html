<section class="scanner-card" aria-labelledby="scanner-title">
  <div class="scanner-heading">
    <span class="eyebrow">Demostración</span>
    <h2 id="scanner-title">Consulta una placa de prueba</h2>
    <p>Solo funciona con las placas ficticias de la demostración.</p>
  </div>

  <div class="demo-plates" aria-label="Placas de demostración">
    @for (demoPlate of demoPlates; track demoPlate) {
      <button type="button" class="demo-plate" (click)="plate = demoPlate; scan()" [disabled]="isLoading()">{{ demoPlate }}</button>
    }
  </div>

  <label class="field-label" for="plate">Placa de demostración</label>
  <div class="plate-input-row">
    <input id="plate" name="plate" [(ngModel)]="plate" maxlength="8" placeholder="ABC-1234" autocomplete="off" (keydown.enter)="scan()" />
    <button type="button" (click)="scan()" [disabled]="isLoading() || !plate.trim()">
      {{ isLoading() ? 'Consultando…' : 'Consultar' }}
    </button>
  </div>
  @if (error()) { <p class="error-message" role="alert">{{ error() }}</p> }
</section>
