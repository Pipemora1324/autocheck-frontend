<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="AutoCheck-CO inicio"><span class="brand-mark">A</span><span><strong>AutoCheck</strong><small>CO</small></span></a>
    <div class="topbar-meta">
      <span class="system-status {{ health.status() }}" role="status" aria-live="polite"><i aria-hidden="true"></i> {{ healthLabel() }}</span>
      @if (auth.user(); as user) {
        <span class="user-info">
          <span class="user-avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="user-text"><strong>{{ user.email }}</strong>@if (auth.isAdmin()) {<small class="role-badge">Admin</small>}</span>
        </span>
        <button class="logout-button" type="button" (click)="logout()">Cerrar sesión</button>
      }
    </div>
  </header>
  <main id="top">
    @if (auth.status() === 'unknown') {
      <div class="session-loading" role="status"><span class="spinner" aria-hidden="true"></span>Restaurando sesión…</div>
    }
    <router-outlet />
  </main>
  <footer><span>AutoCheck-CO</span><span>Informes de inspección · Datos de prueba</span></footer>
</div>
