<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AutoCheck-CO</title>
    <meta
      name="description"
      content="Garaje personal con diagnóstico de testigos del tablero: entiende qué significa cada luz, qué tan urgente es y cuándo ir al mecánico."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e11" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Antes de pintar, para que el tema no parpadee. ThemeService aplica el mismo criterio.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('autocheck-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
          else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
